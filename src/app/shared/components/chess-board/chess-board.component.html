<div class="chess-board">
  <div class="board-grid">
    @for (row of board; track $index; let rowIndex = $index) {
      <div class="board-row">
        @for (piece of row; track $index; let colIndex = $index) {
          <app-chess-square
            [piece]="piece"
            [row]="rowIndex"
            [col]="colIndex"
            [isLight]="isLightSquare(rowIndex, colIndex)"
          ></app-chess-square>
        }
      </div>
    }
  </div>
</div>
