@if (piece) {
  <img 
    class="chess-piece" 
    [src]="getPieceImage()" 
    [alt]="piece.color + ' ' + piece.type"
    [class.white]="piece.color === 'white'" 
    [class.black]="piece.color === 'black'"
    draggable="true"
    (dragstart)="onDragStart($event)"
    (dragend)="onDragEnd($event)"
  />
}
